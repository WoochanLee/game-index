  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:,">
  <link href="styles.css" rel="stylesheet" type="text/css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1CB5WQ597F"></script>
  <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1CB5WQ597F');

<body>
<!-- Loading screen (removed when game starts) -->
<div id="loading-screen">
  <div id="loading-title">Fruit Pop Pop</div>
  <div id="loading-bar-bg">
    <div id="loading-bar-fill"></div>
  </div>
  <div id="loading-text">Loading...</div>
</div>

<div align="center" id="embed-html"></div>
<script type="text/javascript" src="html/html.nocache.js"></script>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());
// Prevent iOS Safari scroll bounce and pull-to-refresh
document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

var embed = document.getElementById('embed-html');
embed.addEventListener('mousedown', function(e) { e.preventDefault(); e.stopPropagation(); window.focus(); }, false);
embed.addEventListener('mouseup', function(e) { e.preventDefault(); e.stopPropagation(); }, false);

// Fix iOS Safari viewport height (address bar)
function fixViewportHeight() {
    document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
}
fixViewportHeight();
window.addEventListener('resize', fixViewportHeight);
</script>
</body>
</html>
